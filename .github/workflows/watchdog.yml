name: Watchdog

# Every other failure mode in this repo now reports itself, but one cannot:
# if GitHub drops the scheduled run, nothing executes and nothing can tell
# you. Silence then means both "working fine" and "dead for a day".
#
# This is the smallest possible job -- no ffmpeg, no render -- whose only
# purpose is to make silence mean one thing. If no reel has been built in
# MAX_QUIET_HOURS it says so, and it also kicks a build so the gap closes
# without you doing anything.
on:
  schedule:
    - cron: "53 0 * * *"       # 09:53 Seoul
    - cron: "53 4 * * *"       # 13:53 Seoul
    - cron: "53 8 * * *"       # 17:53 Seoul
    - cron: "53 12 * * *"      # 21:53 Seoul
    - cron: "53 16 * * *"      # 01:53 Seoul
    - cron: "53 20 * * *"      # 05:53 Seoul
  workflow_dispatch:

permissions:
  contents: read
  actions: write               # to dispatch a catch-up build

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Is the pipeline alive?
        id: check
        env:
          MAX_QUIET_HOURS: ${{ vars.MAX_QUIET_HOURS || '14' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          AGE=$(python -u run.py hours-since-build)
          echo "last reel built ${AGE}h ago (limit ${MAX_QUIET_HOURS}h)"
          if python -c "import os,sys; sys.exit(0 if float('$AGE') > float(os.environ['MAX_QUIET_HOURS']) else 1)"; then
            echo "stale=yes" >> "$GITHUB_OUTPUT"
            python -u run.py alert "No reel has been built for ${AGE}h. Starting a catch-up build now. If this repeats, run: python run.py doctor" || true
          else
            echo "stale=no" >> "$GITHUB_OUTPUT"
            echo "healthy, saying nothing"
          fi

      # Noticing is not enough -- close the gap too.
      - name: Kick a build
        if: steps.check.outputs.stale == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml \
            --repo "${{ github.repository }}" \
            -f count="${{ vars.REELS_PER_RUN || '2' }}"

      - name: Tell me the watchdog itself broke
        if: failure() || cancelled()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u run.py alert "Watchdog failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
