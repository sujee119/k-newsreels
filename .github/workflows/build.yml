name: Build reel

# Daily build. The reel is NOT posted here -- it is uploaded as a release
# asset (which gives Instagram a public URL to fetch later) and sent to
# Telegram for approval. The poll workflow does the posting.
on:
  schedule:
    # Times are UTC; Asia/Seoul is +9. Three builds a day by default.
    - cron: "47 22 * * *"      # 07:47 Seoul
    - cron: "47  4 * * *"      # 13:47 Seoul
    - cron: "47 10 * * *"      # 19:47 Seoul
    # GitHub drops scheduled runs under load -- the 07:47 slot was skipped
    # outright on 12 Oct. These two catch-up slots build ONLY if no reel
    # has been built for a while, so they cost nothing on a normal day.
    - cron: "17  1 * * *"      # 10:17 Seoul, catch-up
    - cron: "17 13 * * *"      # 22:17 Seoul, catch-up
  workflow_dispatch:
    inputs:
      story_url:
        description: "Build one specific article (optional)"
        required: false
        type: string
      count:
        description: "How many reels to build this run"
        required: false
        default: "1"
        type: string

permissions:
  contents: write              # release upload + committing state back

# A group per workflow, NOT one shared with poll.yml. The shared group
# is what was killing the scheduled builds: with cancel-in-progress
# false GitHub keeps only ONE pending run per group, so when a poll was
# running at :47 the build went pending and the next poll -- at most 15
# minutes later -- evicted it. The build was cancelled before it ran a
# single step, which is why this was the only workflow going missing.
#
# The state race that shared group guarded is already handled below, by
# the push loop: fetch, rebase -X theirs, reset --soft, three attempts,
# alert if it still fails. This group only serialises builds with each
# other, which is all it needs to do.
concurrency:
  group: reel-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Must exceed render time plus AUTO_PUBLISH_MINUTES of sleep. At 45
    # with a 30-minute window the job was CANCELLED mid-sleep, and a
    # cancelled job does not trigger if: failure() -- so it died silently.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          # espeak-ng is the offline narration fallback. It is ~5 MB and
          # means a blocked cloud voice cannot stop a build.
          sudo apt-get install -y -qq ffmpeg fonts-dejavu espeak-ng

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          # Microsoft changes the Edge TTS handshake without notice and the
          # fix arrives as a new edge-tts release, so always take the latest.
          pip install --upgrade edge-tts

      # A catch-up slot stands down if a build already landed recently.
      - name: Decide whether this run is needed
        id: gate
        run: |
          SCHED="${{ github.event.schedule }}"
          case "$SCHED" in
            "17  1 * * *"|"17 1 * * *"|"17 13 * * *")
              AGE=$(python -u run.py hours-since-build)
              echo "last reel was ${AGE}h ago"
              if python -c "import sys; sys.exit(0 if float('$AGE') >= 7 else 1)"; then
                echo "catch-up: nothing recent, building"
                echo "go=yes" >> "$GITHUB_OUTPUT"
              else
                echo "catch-up: a build landed ${AGE}h ago, standing down"
                echo "go=no" >> "$GITHUB_OUTPUT"
              fi ;;
            *)
              echo "go=yes" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build the reel
        if: steps.gate.outputs.go == 'yes'
        env:
          SCRIPT_PROVIDER: ${{ vars.SCRIPT_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Without this the runner used the stale default and burned a
          # call on a 404 before auto-discovery found a working model.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-AndrewMultilingualNeural' }}
          TTS_PROVIDERS: ${{ vars.TTS_PROVIDERS || 'gemini,azure,edge,gtts,espeak' }}
          # Reel length, so it can be tuned with a repo variable instead of a
          # redeploy. An unset variable arrives as an EMPTY env var rather
          # than an absent one, which config falls back from, so leaving
          # these unset keeps the config defaults.
          TARGET_SECONDS: ${{ vars.TARGET_SECONDS }}
          MAX_SECONDS: ${{ vars.MAX_SECONDS }}
          # gemini runs on GEMINI_API_KEY above: no second account, and Google
          # lists its TTS models as free of charge on the free tier. It is
          # rate-limited to 3 requests a minute, which one reel never hits.
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE || 'Orus' }}
          GEMINI_TTS_STYLE: ${{ vars.GEMINI_TTS_STYLE || 'a confident male news presenter, clear and brisk, no sing-song' }}
          # Azure Speech: the same neural voices edge-tts borrows, but on the
          # documented endpoint, so no 403 from GitHub's runner IPs. Unset
          # key means the engine reports itself unavailable and the chain
          # falls through to edge exactly as before.
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION || 'koreacentral' }}
          # Tunable without a code change, e.g.
          #   gh variable set WORDS_PER_SECOND --body 3.4
          TTS_RATE: ${{ vars.TTS_RATE || '+40%' }}
          WORDS_PER_SECOND: ${{ vars.WORDS_PER_SECOND || '3.0' }}
          VOICE_DEEPEN: ${{ vars.VOICE_DEEPEN || '0.88' }}
          COVER_ENABLED: ${{ vars.COVER_ENABLED || '1' }}
          COVER_SECONDS: ${{ vars.COVER_SECONDS || '3.2' }}
          COVER_TOP: ${{ vars.COVER_TOP || '330' }}
          COVER_THUMB_MS: ${{ vars.COVER_THUMB_MS || '900' }}
          VIDEO_PRESET: medium
        run: |
          # -u matters: without it Python block-buffers stdout on a runner
          # and the whole log lands at the end with one timestamp, which
          # makes a failed run almost impossible to read.
          if [ -n "${{ inputs.story_url }}" ]; then
            python -u run.py build --story "${{ inputs.story_url }}"
          else
            python -u run.py build --count "${{ inputs.count || vars.REELS_PER_RUN || 1 }}"
          fi

      - name: Publish videos and send for approval
        if: steps.gate.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SLUGS=$(python -u run.py pending-slugs)
          if [ -z "$SLUGS" ]; then
            echo "nothing built this run"
            exit 0
          fi
          # One bad reel must not stop the others, so the loop never
          # trips `bash -e`.
          FAILED=0
          for SLUG in $SLUGS; do
            echo "::group::$SLUG"
            if ! gh release create "reel-$SLUG" "out/$SLUG/reel.mp4" \
                   --title "reel-$SLUG" --notes "auto-generated, pending approval"; then
              gh release upload "reel-$SLUG" "out/$SLUG/reel.mp4" --clobber || {
                echo "could not upload $SLUG"; FAILED=1; echo "::endgroup::"; continue; }
            fi
            URL=$(gh release view "reel-$SLUG" --json assets --jq '.assets[0].url' || true)
            if [ -z "$URL" ]; then
              echo "no asset url for $SLUG"; FAILED=1; echo "::endgroup::"; continue
            fi
            python -u run.py set-video-url "$SLUG" "$URL" || FAILED=1
            python -u run.py notify "$SLUG" || FAILED=1
            echo "::endgroup::"
          done
          [ "$FAILED" = "0" ] || echo "::warning::some reels did not publish"

      # The review window has to be honoured inside this run. The poll
      # cron is throttled by GitHub to roughly once every two hours, so
      # waiting for it would mean a Reject tap is never read in time.
      # An explicit `if:` replaces the implicit success() check, so this has
      # to say so -- otherwise a failed build still sleeps ten minutes.
      - name: Review window
        if: success() && steps.gate.outputs.go == 'yes' && vars.AUTO_PUBLISH != '0'
        run: |
          MINS="${{ vars.AUTO_PUBLISH_MINUTES || '10' }}"
          echo "waiting ${MINS} min for a Reject tap..."
          sleep $(( MINS * 60 ))

      # !cancelled() rather than success(): a run that found no story must
      # still publish reels that ripened since the last run.
      - name: Read decisions, then auto-publish
        if: ${{ !cancelled() && steps.gate.outputs.go == 'yes' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || '1' }}
          AUTO_PUBLISH_MINUTES: ${{ vars.AUTO_PUBLISH_MINUTES || '10' }}
          COVER_ENABLED: ${{ vars.COVER_ENABLED || '1' }}
          COVER_THUMB_MS: ${{ vars.COVER_THUMB_MS || '900' }}
        run: |
          # Reality first: anything already live gets its status corrected
          # so it cannot be posted twice. Never publishes, never gated.
          python -u run.py reconcile || true
          # Explicit taps next, so an Approve posts now and a Reject
          # takes the reel out of the running.
          python -u run.py poll || true
          python -u run.py autopublish

      # After Instagram, never before. Returns 0 even on failure so a
      # YouTube problem cannot turn a successful post into a red run.
      - name: Upload to YouTube
        if: ${{ !cancelled() && steps.gate.outputs.go == 'yes' }}
        continue-on-error: true
        env:
          YT_ENABLED: ${{ vars.YT_ENABLED || '0' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          YT_CATEGORY_ID: ${{ vars.YT_CATEGORY_ID || '28' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u run.py youtube

      - name: Commit state
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name  "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          BR="${GITHUB_REF_NAME:-main}"
          git add state/
          # Decide "nothing to do" ONCE, before committing. The old loop
          # re-tested `git diff --staged --quiet` after a rebase, when the
          # work was already committed rather than staged -- so it printed
          # "no state changes" and exited 0 with the commit unpushed. That
          # is how a published reel kept reading as pending.
          if git diff --staged --quiet && \
             [ "$(git rev-list --count "origin/$BR"..HEAD 2>/dev/null || echo 0)" = "0" ]; then
            echo "no state changes"; exit 0
          fi
          git diff --staged --quiet || git commit -q -m "state $(date -u +%FT%TZ)"
          for attempt in 1 2 3; do
            if git push; then echo "state pushed"; exit 0; fi
            echo "push rejected, reconciling (attempt $attempt)"
            git fetch -q origin "$BR"
            if ! git rebase -X theirs "origin/$BR"; then
              git rebase --abort || true
              # Keep this run's state files, re-commit them on top of theirs.
              git reset --soft "origin/$BR"
              git add state/
              git diff --staged --quiet || git commit -q -m "state $(date -u +%FT%TZ)"
            fi
          done
          # A lost state push is how a published reel kept reading
          # "pending". reconcile repairs it on the next run, but say so now.
          echo "::warning::could not push state after 3 attempts"
          python -u run.py alert "State could not be pushed after 3 attempts. Published reels may still read as pending until the next run reconciles them. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

      # Last step on purpose: state is committed above even on failure, so
      # by the time this runs the repo already holds whatever was learned.
      # One honest message beats a green tick on a run that did nothing.
      - name: Tell me this run failed
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u run.py alert "${{ github.workflow }} failed. Run: python run.py doctor -- or open ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Tell me this run was cancelled
        if: cancelled()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u run.py alert "${{ github.workflow }} was CANCELLED (usually the job timeout). Nothing was posted. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
