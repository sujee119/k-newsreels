name: Build reel

# Daily build. The reel is NOT posted here -- it is uploaded as a release
# asset (which gives Instagram a public URL to fetch later) and sent to
# Telegram for approval. The poll workflow does the posting.
on:
  schedule:
    # Times are UTC; Asia/Seoul is +9. Three builds a day by default.
    - cron: "47 22 * * *"      # 07:47 Seoul
    - cron: "47  4 * * *"      # 13:47 Seoul
    - cron: "47 10 * * *"      # 19:47 Seoul
    # GitHub drops scheduled runs under load -- the 07:47 slot was skipped
    # outright on 12 Oct. These two catch-up slots build ONLY if no reel
    # has been built for a while, so they cost nothing on a normal day.
    - cron: "17  1 * * *"      # 10:17 Seoul, catch-up
    - cron: "17 13 * * *"      # 22:17 Seoul, catch-up
  workflow_dispatch:
    inputs:
      story_url:
        description: "Build one specific article (optional)"
        required: false
        type: string
      count:
        description: "How many reels to build this run"
        required: false
        default: "1"
        type: string

permissions:
  contents: write              # release upload + committing state back

# ONE group across both workflows. state/ is committed by
# whichever run finishes, and two runs pushing it at once is
# what lost a published status this morning. Serialising them
# removes the race rather than retrying through it.
concurrency:
  group: reel-state
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Must exceed render time plus AUTO_PUBLISH_MINUTES of sleep. At 45
    # with a 30-minute window the job was CANCELLED mid-sleep, and a
    # cancelled job does not trigger if: failure() -- so it died silently.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          # espeak-ng is the offline narration fallback. It is ~5 MB and
          # means a blocked cloud voice cannot stop a build.
          sudo apt-get install -y -qq ffmpeg fonts-dejavu espeak-ng

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          # Microsoft changes the Edge TTS handshake without notice and the
          # fix arrives as a new edge-tts release, so always take the latest.
          pip install --upgrade edge-tts

      # A catch-up slot stands down if a build already landed recently.
      - name: Decide whether this run is needed
        id: gate
        run: |
          SCHED="${{ github.event.schedule }}"
          case "$SCHED" in
            "17  1 * * *"|"17 1 * * *"|"17 13 * * *")
              AGE=$(python -u run.py hours-since-build)
              echo "last reel was ${AGE}h ago"
              if python -c "import sys; sys.exit(0 if float('$AGE') >= 7 else 1)"; then
                echo "catch-up: nothing recent, building"
                echo "go=yes" >> "$GITHUB_OUTPUT"
              else
                echo "catch-up: a build landed ${AGE}h ago, standing down"
                echo "go=no" >> "$GITHUB_OUTPUT"
              fi ;;
            *)
              echo "go=yes" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build the reel
        if: steps.gate.outputs.go == 'yes'
        env:
          SCRIPT_PROVIDER: ${{ vars.SCRIPT_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Without this the runner used the stale default and burned a
          # call on a 404 before auto-discovery found a working model.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-AndrewMultilingualNeural' }}
          TTS_PROVIDERS: ${{ vars.TTS_PROVIDERS || 'gemini,azure,edge,gtts,espeak' }}
          # Narration engines, in order. gemini runs on GEMINI_API_KEY above --
          # no second account, and Google lists its TTS models as free on
          # the free tier. azure is the same neural voices edge borrows but
          # on the documented endpoint; it needs AZURE_SPEECH_KEY and is
          # skipped silently when that is unset. Either way the chain still
          # falls through to edge, gtts and espeak exactly as before.
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE || 'Orus' }}
          GEMINI_TTS_STYLE: ${{ vars.GEMINI_TTS_STYLE }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION || 'koreacentral' }}
